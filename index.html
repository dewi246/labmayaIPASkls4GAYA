a-text text-sm font-medium text-slate-500"></p>    </footer>   </div>  </div>  <script>    document.addEventListener("DOMContentLoaded", () => {      lucide.createIcons();      const voiceScripts = {        muscle: "Gaya otot adalah gaya yang berasal dari tenaga otot tubuh kita. Saat kita mendorong peti, otot tangan dan kaki bekerja sehingga peti dapat bergerak.",        gravity: "Gaya gravitasi adalah gaya tarik bumi. Karena gravitasi, bola yang dilepas dari tempat tinggi akan jatuh ke bawah menuju bumi.",        magnet: "Gaya magnet adalah gaya tarik atau dorong dari magnet. Magnet dapat menarik benda tertentu, misalnya besi dan baja seperti klip kertas.",        friction: "Gaya gesek terjadi ketika dua permukaan saling bersentuhan. Permukaan yang kasar menghasilkan gaya gesek lebih besar sehingga benda lebih cepat berhenti.",        spring: "Gaya pegas muncul ketika pegas ditarik atau ditekan. Semakin besar tarikan, pegas semakin panjang dan ingin kembali ke bentuk semula."      };      const tabs = document.querySelectorAll(".tab-button");      const panels = document.querySelectorAll(".sim-panel");      tabs.forEach((tab) => {        tab.addEventListener("click", () => {          const activeLab = tab.dataset.lab;          window.speechSynthesis.cancel();          document.querySelectorAll(".voice-button").forEach(button => button.classList.remove("is-speaking"));          tabs.forEach(button => {            const isCurrent = button === tab;            button.classList.toggle("active", isCurrent);            button.setAttribute("aria-pressed", String(isCurrent));          });          panels.forEach(panel => panel.classList.toggle("active", panel.id === activeLab + "-panel"));        });      });      document.querySelectorAll(".voice-button").forEach((button) => {        button.addEventListener("click", () => {          const voiceKey = button.dataset.voice;          const currentlySpeaking = button.classList.contains("is-speaking");          window.speechSynthesis.cancel();          document.querySelectorAll(".voice-button").forEach(item => item.classList.remove("is-speaking"));          if (currentlySpeaking) return;          if (!("speechSynthesis" in window)) return;          const speech = new SpeechSynthesisUtterance(voiceScripts[voiceKey]);          speech.lang = "id-ID";          speech.rate = 0.9;          speech.pitch = 1.08;          speech.onend = () => button.classList.remove("is-speaking");          speech.onerror = () => button.classList.remove("is-speaking");          button.classList.add("is-speaking");          window.speechSynthesis.speak(speech);        });      });      const muscleSlider = document.getElementById("muscle-slider");      const crate = document.getElementById("crate");      const muscleArm = document.getElementById("muscle-arm");      const muscleArrow = document.getElementById("muscle-arrow");      const muscleResult = document.getElementById("muscle-result");      function updateMuscle() {        const power = Number(muscleSlider.value);        crate.style.left = (31 + power * 0.43) + "%";        muscleArm.style.transform = "rotate(" + (-8 + power * 0.22) + "deg)";        muscleArrow.style.transform = "scaleX(" + (0.65 + power / 145) + ")";        muscleArrow.style.transformOrigin = "left center";        muscleResult.textContent = power < 35          ? "Dorongan kecil membuat peti bergerak sedikit."          : power < 70            ? "Dorongan lebih kuat membuat peti bergeser lebih jauh."            : "Hebat! Gaya otot yang kuat membuat peti bergerak jauh.";      }      muscleSlider.addEventListener("input", updateMuscle);      updateMuscle();      const gravitySlider = document.getElementById("gravity-slider");      const gravityBall = document.getElementById("gravity-ball");      const gravityArrow = document.getElementById("gravity-arrow");      const gravityResult = document.getElementById("gravity-result");      function updateGravity() {        const height = Number(gravitySlider.value);        const ballTop = 205 - height * 1.48;        gravityBall.style.top = ballTop + "px";        gravityArrow.style.top = (ballTop + 63) + "px";        gravityResult.textContent = height < 35          ? "Bola dilepas dari tempat rendah, lalu gravitasi menariknya ke bawah."          : height < 70            ? "Semakin tinggi bola, semakin jauh perjalanan jatuhnya."            : "Bola berada sangat tinggi. Gravitasi tetap menariknya menuju bumi.";      }      gravitySlider.addEventListener("input", updateGravity);      updateGravity();      const magnetSlider = document.getElementById("magnet-slider");      const magnetObject = document.getElementById("magnet-object");      const clips = [        document.getElementById("clip-one"),        document.getElementById("clip-two"),        document.getElementById("clip-three")      ];      const magnetResult = document.getElementById("magnet-result");      function updateMagnet() {        const closeness = Number(magnetSlider.value);        magnetObject.style.left = (12 + closeness * 0.35) + "%";        const attracted = closeness > 58;        clips.forEach((clip, index) => {          if (attracted) {            clip.style.left = (38 + closeness * 0.18 + index * 2.1) + "%";            clip.style.top = (152 + index * 20) + "px";            clip.style.transform = "rotate(" + (index % 2 ? -20 : 20) + "deg)";          } else {            clip.style.left = (66 + index * 7.5) + "%";            clip.style.top = (168 + index * 18) + "px";            clip.style.transform = "rotate(28deg)";          }        });        magnetResult.textContent = attracted          ? "Magnet sudah cukup dekat. Klip kertas tertarik karena mengandung logam."          : "Magnet masih terlalu jauh. Dekatkan magnet agar gaya magnet terasa.";      }      magnetSlider.addEventListener("input", updateMagnet);      updateMagnet();      const frictionSlider = document.getElementById("friction-slider");      const frictionBlock = document.getElementBy
